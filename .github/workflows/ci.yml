name: CI

on:
  push:
  pull_request:

jobs:
  guard-injection-surface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block process-execution APIs in src
        run: |
          set -eu
          if rg -n --pcre2 '\b(system|popen|execl|execle|execlp|execv|execve|execvp|execvpe|fork|vfork|posix_spawn|posix_spawnp)\s*\(' src; then
            echo "Disallowed process-execution API found in src/" >&2
            exit 1
          fi

  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show compiler
        run: ${{ matrix.compiler }} --version

      - name: Run unit tests
        run: make clean && make test CC=${{ matrix.compiler }}

      - name: Run CLI integration tests
        run: make test-integration CC=${{ matrix.compiler }}

      - name: Build release target
        run: make release CC=${{ matrix.compiler }}

      - name: Validate zsh completion script
        run: zsh -n completions/zsh/_wall-c

  sanitizer:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show compiler
        run: clang --version

      - name: Run sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: make clean && make sanitize CC=clang

  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck tests/integration_test.sh
