name: CI

on:
  push:
  pull_request:

jobs:
  guard-injection-surface:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: apt-get update && apt-get install -y --no-install-recommends ripgrep

      - name: Block process-execution APIs in src
        run: |
          set -eu
          if rg -n --pcre2 '\b(system|popen|execl|execle|execlp|execv|execve|execvp|execvpe|fork|vfork|posix_spawn|posix_spawnp)\s*\(' src; then
            echo "Disallowed process-execution API found in src/" >&2
            exit 1
          fi

  build-and-test-linux:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential clang make zsh

      - name: Show compiler
        run: ${{ matrix.compiler }} --version

      - name: Run unit tests
        run: make clean && make test CC=${{ matrix.compiler }}

      - name: Run CLI integration tests
        run: make test-integration CC=${{ matrix.compiler }}

      - name: Build release target
        run: make release CC=${{ matrix.compiler }}

      - name: Validate zsh completion script
        run: zsh -n completions/zsh/_wall-c

  build-and-test-macos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
        compiler: [gcc, clang]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show compiler
        run: ${{ matrix.compiler }} --version

      - name: Run unit tests
        run: make clean && make test CC=${{ matrix.compiler }}

      - name: Run CLI integration tests
        run: make test-integration CC=${{ matrix.compiler }}

      - name: Build release target
        run: make release CC=${{ matrix.compiler }}

      - name: Validate zsh completion script
        run: zsh -n completions/zsh/_wall-c

  sanitizer-linux:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang make

          # clang sanitizers on Linux require compiler-rt runtime libraries.
          clang_major="$(clang -dumpversion | cut -d. -f1)"
          apt-get install -y --no-install-recommends "libclang-rt-${clang_major}-dev" \
            || apt-get install -y --no-install-recommends libclang-rt-dev

      - name: Show compiler
        run: clang --version

      - name: Show clang resource dir
        run: clang --print-resource-dir

      - name: Run sanitizers (Linux)
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: make clean && make sanitize CC=clang

  sanitizer-macos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show compiler
        run: clang --version

      - name: Run sanitizers (macOS)
        env:
          ASAN_OPTIONS: detect_leaks=0:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: make clean && make sanitize CC=clang

  cross-target-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build aarch64-linux-musl
        run: zig build release -Dtarget=aarch64-linux-musl

  lint-shell:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: apt-get update && apt-get install -y --no-install-recommends shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck tests/integration_test.sh
